name: Deploy to GitHub Pages

on:
  push:
    branches: [main, '1030']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source (always main)
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Build production without changing its URLs
        run: bash scripts/build-pages.sh
      - name: Checkout isolated 1030 source
        uses: actions/checkout@v4
        with:
          ref: '1030'
          path: .preview-1030-source
      - name: Build and overlay only /previews/1030/
        run: |
          set -euo pipefail
          bash .preview-1030-source/scripts/build-pages.sh
          mkdir -p .pages-dist/previews/1030
          cp -a .preview-1030-source/.pages-dist/. .pages-dist/previews/1030/
          git -C .preview-1030-source rev-parse HEAD > .pages-dist/previews/1030/REVISION
          test -f .pages-dist/learn.html
          test -f .pages-dist/previews/1030/learn-1030.html
      # Keep this shared workflow synchronized on main, 1030 and 知识地图.
      # All production deploys retain both independently developed previews.
      - name: Checkout isolated knowledge-map source
        uses: actions/checkout@v4
        with:
          ref: '知识地图'
          path: .preview-knowledge-map-source
      - name: Build and overlay only /knowledge-map-preview/
        run: |
          set -euo pipefail
          preview_source=".preview-knowledge-map-source"
          bash "$preview_source/scripts/build-pages.sh"
          for file in knowledge-map-v1.html knowledge-map-v2.html learning-plan.html; do
            cp "$preview_source/$file" "$preview_source/.pages-dist/$file"
          done
          mkdir -p .pages-dist/knowledge-map-preview
          cp -a "$preview_source/.pages-dist/." .pages-dist/knowledge-map-preview/
          git -C "$preview_source" rev-parse HEAD > .pages-dist/knowledge-map-preview/REVISION
          test -f .pages-dist/knowledge-map.html
          test -f .pages-dist/previews/1030/learn-1030.html
          test -f .pages-dist/knowledge-map-preview/knowledge-map.html
          test -f .pages-dist/knowledge-map-preview/knowledge-map-v1.html
          test -f .pages-dist/knowledge-map-preview/learning-plan.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
