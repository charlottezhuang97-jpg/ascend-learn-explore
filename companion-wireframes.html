<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>白板、IDE 与 AI 学伴 · 低保真</title>
<style>
@font-face{font-family:Harmony;src:url('assets/fonts/HarmonyOS_Sans_SC_Regular.woff2')}*{box-sizing:border-box}body{margin:0;background:#eee;font:14px/1.6 Harmony,'PingFang SC',sans-serif;color:#242424}button,textarea{font:inherit}button{cursor:pointer;border:1px solid #ccc;border-radius:8px;background:white;color:inherit;padding:9px 14px}button:hover{background:#eee}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #555;outline-offset:3px}.black{background:#222;color:white;border-color:#222}.black:hover{background:#444}.review{padding:24px 32px 16px;background:#fff;border-bottom:1px solid #ccc}.review h1{font-size:20px;font-weight:500;margin:0 0 4px}.muted{color:#666}.review p{margin:0}.states{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.states button[aria-selected=true]{background:#222;color:white}.frame{margin:20px 32px 0;background:#fafafa;border:1px solid #bbb;border-radius:12px;overflow:hidden;height:650px;position:relative}.top{height:68px;border-bottom:1px solid #ddd;background:white;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;gap:12px}.left,.tools{display:flex;align-items:center;gap:8px}.top h2{font-size:16px;font-weight:400;margin:0}.bubble{width:44px;height:44px;border-radius:50%;padding:0;font-size:13px;border:1px solid #333}.content{height:calc(100% - 68px);display:flex;gap:8px;padding:8px;position:relative}.board{flex:1;min-width:0;border:1px solid #d0d0d0;border-radius:12px;position:relative;background:radial-gradient(#ddd 1px,transparent 1px) 0 0/20px 20px;padding:32px 36px;overflow:auto}.board h3{font-size:16px;font-weight:500;margin:0 0 20px}.board h4{font-size:16px;font-weight:400;margin:20px 0 8px}.diagram{display:flex;gap:12px;align-items:center;margin:24px 0}.node{border:1px solid #777;background:white;border-radius:8px;padding:18px;flex:1;text-align:center}.code{border:1px solid #bbb;background:#f5f5f5;border-radius:12px;padding:16px;margin:20px 0;width:min(510px,100%)}.code-head{display:flex;align-items:center;justify-content:space-between;gap:8px}pre{font:13px/1.9 monospace;white-space:pre-wrap;color:#444}.caption{position:absolute;bottom:30px;left:10%;right:10%;text-align:center;background:white;border:1px solid #ddd;border-radius:8px;padding:10px}.page{position:absolute;bottom:8px;left:16px;font-size:12px;color:#777}.ide{width:47%;border:1px solid #bbb;background:white;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:300px}.ide-head{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd}.editor{width:100%;flex:1;resize:none;padding:20px;border:0;background:#fafafa;font:14px/1.8 monospace;outline-offset:-3px}.console{height:112px;border-top:1px solid #ddd;padding:12px 16px;font-size:12px}.split{width:4px;background:#ccc;cursor:col-resize;flex-shrink:0;border:0;padding:0;border-radius:4px;touch-action:none}.panel{width:330px;background:white;border:1px solid #bbb;border-radius:12px;display:flex;flex-direction:column;padding:18px;flex-shrink:0;z-index:3}.overlay{position:absolute;right:8px;top:8px;bottom:8px;width:min(380px,47%);box-shadow:-12px 0 24px #0001}.panel-head{display:flex;justify-content:space-between;align-items:center}.panel h3{font-size:16px;font-weight:400;margin:0}.panel-tabs{display:flex;gap:8px;margin:16px 0;border-bottom:1px solid #ddd;padding-bottom:8px}.panel-tabs button{padding:6px;font-size:13px;border:0}.panel-tabs button[aria-selected=true]{background:#eee}.panel-body{overflow:auto;flex:1}.context{border:1px dashed #bbb;padding:10px;font-size:12px;color:#666}.message{margin:16px 0;padding:14px;background:#f3f3f3;border-radius:8px}.message p{margin:8px 0}.message h4{font-size:14px;margin:0}.chat-input{margin-top:16px;display:flex;gap:8px}.chat-input button{white-space:nowrap;flex-shrink:0}.chat-input input{width:100%;min-width:0;border:1px solid #ccc;border-radius:8px;padding:10px}.nudge{position:absolute;right:20px;top:76px;width:330px;z-index:4;background:white;border:1px solid #aaa;border-radius:12px;padding:16px;box-shadow:0 8px 20px #0001}.nudge p{margin:6px 0 12px}.nudge header{display:flex;justify-content:space-between}.nudge header button{border:0;padding:0 4px}.preview,.home{padding:30px 40px;max-width:1040px;margin:auto;width:100%;overflow:auto}.preview h2,.home h2{font-size:20px;font-weight:400;margin:0 0 8px}.surface{border:1px solid #ccc;background:white;border-radius:12px;padding:20px;margin-top:20px}.surface h3{font-size:16px;font-weight:500;margin:0 0 8px}.prereq{display:flex;gap:12px;align-items:center;border-top:1px solid #ddd;padding:12px 0}.prereq:first-of-type{margin-top:12px}.prereq div{flex:1}.prereq p{margin:0;font-size:13px;color:#666}.row{display:flex;gap:12px;flex-wrap:wrap}.stamp{border:1px solid #aaa;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;flex-shrink:0}.annotation{margin:16px 32px 28px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}.annotation p{margin:4px 0 0;color:#666;font-size:13px}.annotation b{font-weight:500}.review-tag{font-size:12px;color:#666;float:right}.toast{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:white;padding:10px 20px;border-radius:8px;z-index:8}.hidden{display:none!important}.course-placeholder{display:flex;gap:16px}.thumb{width:100px;height:88px;border:1px dashed #aaa;display:grid;place-items:center;color:#777}.summary{border-left:3px solid #888;padding-left:12px}.hint{font-size:12px;color:#777}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:800px){.review{padding:16px}.frame{margin:12px;height:800px}.annotation{margin:12px;grid-template-columns:1fr}.tools .optional{display:none}.top{padding:8px}.top h2{font-size:14px}.content{flex-wrap:wrap;overflow:auto}.board{min-height:450px;padding:20px}.ide,.panel{width:100%;min-height:400px}.overlay{position:absolute;max-width:90%;width:340px;min-height:0}.split{display:none}.preview,.home{padding:20px}.caption{position:static;margin-top:20px}.nudge{right:12px;width:min(330px,90%)}.diagram{gap:6px}.node{padding:12px 6px}}@media print{.review,.annotation{break-inside:avoid}.frame{margin:10px 0;height:650px}.states{display:none}}
</style></head><body>
<header class="review"><span class="review-tag">低保真讨论稿 · 2026.09.28</span><h1>白板、IDE 与 AI 学伴</h1><p class="muted">六个关键状态。点击状态切换，体验置入代码、收起学伴、前置建议与错题回看。</p><nav class="states" aria-label="低保真场景"></nav></header>
<main class="frame"><header class="top"><div class="left"><button id="exit" aria-label="回到首页场景">×</button><h2 id="lessonTitle">Ascend C · 数据搬运与计算</h2></div><div class="tools"><span class="optional muted">白板 / 视频</span><span class="optional">100%　 ‹ 1 / 3 ›</span><button id="ideToggle">打开 IDE</button><button id="companion" class="bubble" aria-label="展开 AI 学伴" aria-expanded="false">学伴</button></div></header><div id="content" class="content"></div><div id="toast" role="status" class="toast hidden"></div></main>
<section class="annotation" id="annotation"></section>
<script>
const scenes=[['listen','01 白板听讲'],['practice','02 白板＋IDE'],['assistant','03 IDE 中的学伴'],['prerequisite','04 前置学习'],['review','05 错题回顾'],['home','06 首页回访']];
const notes={listen:['入口','收起后的学伴固定在右上角。板书代码提供置入 IDE 入口。','状态保留','切换实践时保留板书页码、缩放和字幕位置。','主动提醒','听讲中不自动展开面板；建议在停顿点显示。'],practice:['布局','左白板、右 IDE，中间分隔条可拖动或用方向键调宽。','置入策略','插入光标处或新建文件，不覆盖已编辑代码。','上下文','示例来源与课节一起带入；关闭 IDE 后保留代码。'],assistant:['学伴层级','用户触发后临时覆盖 IDE；关闭即恢复编辑。','统一内容','对话、我的笔记、学习回顾属于同一个学伴。','帮助边界','解读带上当前代码；任何代码改动由用户操作。'],prerequisite:['触发','进入新课程且存在前置知识依赖。','证据','掌握记录未知时邀请自测，不直接判断用户不会。','用户选择','提供前置学习、自测和直接开始三个方向。'],review:['触发','测验已提交，按关联知识点汇总错题。','展开','结果摘要由用户点击进入学习回顾面板。','下一步','查看解析、回到原板书或重新练习。'],home:['返回触点','继续学习卡呈现未完成实验与待复习内容。','分身形态','右上气泡与学习页保持同一身份与位置。','打扰控制','不自动展开；同事件去重，冷却时长待细化。']};
let state='listen', open=false, tab='对话', code='// 来源：课节 2 · 板书第 1 页\nCopyIn();\nCompute();\nCopyOut();', width=47;
const content=document.querySelector('#content');
document.querySelector('.states').innerHTML=scenes.map(([id,t])=>`<button data-scene="${id}" aria-selected="false">${t}</button>`).join('');
function board(){return `<section class="board"><span class="muted">板书 01 / 数据流</span><h3>把输入数据搬入，再计算，最后写回</h3><div class="diagram"><div class="node">CopyIn<br><small>输入搬运</small></div><span>→</span><div class="node">Compute<br><small>向量计算</small></div><span>→</span><div class="node">CopyOut<br><small>结果写回</small></div></div><h4>示例代码</h4><div class="code"><div class="code-head"><span>kernel.cpp · 基础结构</span><button class="black" data-action="insert">置入 IDE</button></div><pre>CopyIn();\nCompute();\nCopyOut();</pre><button data-action="note">加入我的笔记</button></div><div class="caption">讲解字幕：先确认数据在哪里，再决定计算如何执行。</div><span class="page">课节 2　 /　 当前进度已保留</span></section>`}
function ide(){return `<div class="split" role="separator" tabindex="0" aria-label="调整 IDE 宽度" aria-orientation="vertical" aria-valuemin="30" aria-valuemax="65" aria-valuenow="${width}"></div><section class="ide" style="width:${width}%"><header class="ide-head"><span>IDE · kernel.cpp</span><div><button data-action="explain">解读</button> <button class="black" data-action="run">运行</button></div></header><div style="padding:8px 16px" class="hint">来自：数据搬运与计算 · 板书 1</div><textarea class="editor" aria-label="代码编辑器"></textarea><div class="console" id="console">终端 / 输出<br><span class="muted">点击运行可查看演示结果。</span></div></section>`}
function panel(overlay=false){let body=tab==='我的笔记'?'<div class="message"><h4>数据搬运的三个阶段</h4><p>CopyIn → Compute → CopyOut</p><small>课节 2 · 板书 1</small><div class="actions"><button data-action="backboard">回到板书</button></div></div>':tab==='学习回顾'?'<div class="message"><h4>3 道错题涉及数据搬运</h4><p>题 2、4、5 均涉及输入输出位置判断，可先复习再练习。</p><small>依据：本次已提交的测验记录（演示）</small><div class="actions"><button data-action="analysis">查看解析</button><button data-action="backboard">回看板书</button></div></div>':'<div class="context">已带入：课节 2、板书第 1 页、当前代码</div><div class="message"><h4>这段代码分为三个阶段</h4><p>CopyIn 搬入输入，Compute 执行计算，CopyOut 写回结果。可以先检查每个阶段的输入输出位置。</p><button data-action="note">保存解读到笔记</button></div>';return `<aside class="panel ${overlay?'overlay':''}" aria-label="AI 学伴面板"><div class="panel-head"><h3>AI 学伴</h3><button data-action="close" aria-label="收起 AI 学伴">×</button></div><nav class="panel-tabs">${['对话','我的笔记','学习回顾'].map(t=>`<button data-tab="${t}" aria-selected="${t===tab}">${t}</button>`).join('')}</nav><div class="panel-body">${body}</div><form class="chat-input"><input aria-label="向学伴提问" placeholder="就当前内容提问…"><button type="submit">发送</button></form></aside>`}
function nudge(text,action,label){return `<aside class="nudge"><header><b>AI 学伴</b><button data-action="dismiss" aria-label="关闭建议">×</button></header><p>${text}</p><button class="black" data-action="${action}">${label}</button> <button data-action="dismiss">稍后</button></aside>`}
function render(){document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.scene===state)));document.querySelector('#companion').setAttribute('aria-expanded',String(open));document.querySelector('#lessonTitle').textContent=state==='home'?'开发者学习中心':state==='prerequisite'?'课程预览 · Ascend C 算子开发':'Ascend C · 数据搬运与计算';document.querySelector('#ideToggle').hidden=['home','prerequisite','review'].includes(state);document.querySelector('#ideToggle').textContent=['practice','assistant'].includes(state)?'收起 IDE':'打开 IDE';
if(['listen','practice','assistant'].includes(state)){const hasIDE=state!=='listen';content.innerHTML=board()+(hasIDE?ide():'')+(open?panel(hasIDE):'');const editor=document.querySelector('.editor');if(editor){editor.value=code;editor.addEventListener('input',()=>code=editor.value)}bindSplit();}
if(state==='prerequisite'){content.innerHTML=`<section class="preview"><span class="muted">开始之前</span><h2>Ascend C 算子开发</h2><p>学习自定义算子的编译、运行与结果验证。</p><div class="surface"><h3>建议先确认这两项基础</h3><p class="muted">本课程需要张量基础与 CANN 环境知识。</p><div class="prereq"><span class="stamp">1</span><div>张量形状与广播机制<p>掌握情况未知 · 尚无自测记录</p></div><button data-action="prereq">查看前置课</button></div><div class="prereq"><span class="stamp">2</span><div>CANN 环境配置<p>掌握情况未知 · 可直接开始或先自测</p></div><button data-action="selftest">快速自测</button></div></div><div class="surface"><h3>课程目录</h3><p>01 算子开发入门　　02 编程模型　　03 实践与验证</p><button class="black" data-action="direct">直接开始学习</button></div></section>${open?panel():nudge('你是否熟悉张量广播？可以用两道题确认学习起点。','selftest','快速自测')}`;}
if(state==='review'){content.innerHTML=`<section class="preview"><span class="muted">测验已提交 · 演示数据</span><h2>本次学习回顾</h2><div class="surface"><h3>已完成 5 道题，其中 2 道正确</h3><div class="summary"><p>3 道错题涉及数据搬运</p><p class="muted">可以从输入与输出位置开始复习，再回到原题验证。</p></div><button class="black" data-action="review">查看错题总结</button></div><div class="surface"><h3>建议的复习顺序</h3><p>回看板书第 1 页 → 对照示例代码 → 重新练习</p><button data-action="backboard">回看板书</button></div></section>${open?panel():''}`;}
if(state==='home'){content.innerHTML=`<section class="home"><span class="muted">我的学习</span><h2>继续上次的任务</h2><div class="surface course-placeholder"><div class="thumb">课程封面</div><div><h3>Ascend C 算子开发</h3><p>上次完成了代码编辑，实验还差结果验证。</p><button class="black" data-action="resume">继续实验</button></div></div><div class="surface"><h3>待复习 · 数据搬运</h3><p>有 3 道错题待回顾，来自上次提交的测验。</p><button data-action="review">复习错题</button></div></section>${open?panel():''}`;}
const n=notes[state];document.querySelector('#annotation').innerHTML=[0,2,4].map(i=>`<div><b>${n[i]}</b><p>${n[i+1]}</p></div>`).join('');}
function go(id){state=id;open=id==='assistant';tab=id==='review'?'学习回顾':'对话';render()}
function toast(text){const t=document.querySelector('#toast');t.textContent=text;t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),2600)}
document.querySelector('.states').onclick=e=>{if(e.target.dataset.scene)go(e.target.dataset.scene)};
document.querySelector('#companion').onclick=()=>{open=!open;render()};document.querySelector('#exit').onclick=()=>go('home');document.querySelector('#ideToggle').onclick=()=>go(state==='listen'?'practice':'listen');
content.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}const a=b.dataset.action;
if(a==='insert'){if(state==='listen'){go('practice');toast('代码已置入新文件，板书位置已保留')}else{const box=document.createElement('div');box.className='nudge';box.innerHTML='<b>置入示例代码</b><p>选择置入方式，保留已编辑内容。</p><button data-action="atcursor">插入光标处</button> <button data-action="newfile">新建文件</button> <button data-action="dismiss">取消</button>';content.append(box)}}
if(a==='atcursor'){const ed=document.querySelector('.editor');const pos=ed.selectionStart;code=code.slice(0,pos)+'\nCopyIn();\nCompute();\nCopyOut();\n'+code.slice(pos);render();toast('已插入，原有代码保留')}
if(a==='newfile'){toast('演示：新建示例文件，原文件保留');e.target.closest('.nudge').remove()}
if(a==='explain'){open=true;tab='对话';render()}if(a==='close'){open=false;render()}
if(a==='note'){open=true;tab='我的笔记';render();toast('已保存到我的笔记')}
if(a==='dismiss')b.closest('.nudge').remove();if(a==='run'){document.querySelector('#console').innerHTML='演示运行结束<br>环境初始化失败 · 示例错误 ENV_INIT';content.insertAdjacentHTML('beforeend',nudge('演示场景：同类环境错误重复出现，需要一起定位吗？','explain','帮我定位'))}
if(a==='direct'||a==='backboard')go('listen');if(a==='resume')go('practice');if(a==='review'){state='review';open=true;tab='学习回顾';render()}
if(a==='analysis')b.closest('.message').insertAdjacentHTML('beforeend','<p>解析示例：CopyIn 负责输入搬运；CopyOut 负责结果写回。返回原题逐项核对。</p>');
if(a==='selftest'||a==='prereq'){toast(a==='selftest'?'低保真入口：进入张量基础自测，完成后更新掌握记录':'低保真入口：张量形状与广播机制课程预览')}
});
content.addEventListener('submit',e=>{e.preventDefault();const input=e.target.querySelector('input');if(input.value.trim()){const p=document.createElement('p');p.className='message';p.textContent=input.value;document.querySelector('.panel-body').append(p);input.value='';toast('演示已记录问题；尚未接入 AI 服务')}});
function bindSplit(){const split=document.querySelector('.split');if(!split)return;const change=v=>{width=Math.max(30,Math.min(65,v));document.querySelector('.ide').style.width=width+'%';split.setAttribute('aria-valuenow',Math.round(width))};split.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();change(width+(e.key==='ArrowLeft'?2:-2))}};split.onpointerdown=e=>{split.setPointerCapture(e.pointerId);split.onpointermove=ev=>{const r=content.getBoundingClientRect();change((r.right-ev.clientX)/r.width*100)};split.onpointerup=()=>split.onpointermove=null}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&open){open=false;render();document.querySelector('#companion').focus()}});render();
</script></body></html>
