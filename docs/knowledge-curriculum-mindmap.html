<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识地图 · 课程思维导图</title>
<style>
*{box-sizing:border-box}body{margin:0;width:3140px;height:1840px;background:#f8faff;color:#20344f;font-family:'PingFang SC','Microsoft YaHei',sans-serif}header{padding:50px 60px 25px}h1{font-size:42px;margin:0 0 16px}header p{font-size:23px;color:#617895;margin:0}#map{position:relative;height:1580px;margin:0 40px}svg{position:absolute;inset:0;overflow:visible}.box{position:absolute;display:flex;flex-direction:column;justify-content:center;gap:12px;border:1px solid #d3dfef;background:#fff;border-radius:16px;padding:20px;font-size:23px;line-height:1.5}.root{background:#176bfa;color:#fff;border:0;font-weight:600}.scene{background:#eaf2ff;border-color:#aac8ff;font-weight:600;font-size:27px}.group{background:#f0f5ff;font-weight:600}.path{background:repeating-linear-gradient(135deg,#fff 0 20px,#edf3ff 20px 21px);font-weight:600}.course{font-size:22px}.meta{display:flex;gap:12px;align-items:center;font-size:18px;color:#607797}.level{padding:2px 10px;border-radius:5px;font-size:18px}.beginner{background:#e5f5ef;color:#19664d}.intermediate{background:#eaf1ff;color:#245aab}.advanced{background:#f2eafb;color:#704397}footer{padding:0 60px;font-size:20px;color:#617895}path{fill:none;stroke:#bfcee1;stroke-width:2}path.order{stroke:#397adc;marker-end:url(#arrow)}marker path{fill:#397adc;stroke:0}
</style></head><body><header><h1>昇腾学习 · 课程思维导图</h1><p>本次新增 27 门课程 · 9 条课程序列　｜　灰线表示归属，蓝色箭头表示按顺序学习　｜　初级 / 中级 / 高级以文字与颜色区分</p></header><main id="map" aria-label="按用户输入顺序整理的课程层级与学习依赖"><svg width="3060" height="1580"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs></svg></main><footer>保留输入原文：“大模型许涟全流程”；两门同名 MindStudio 算子调试课程按不同等级分别保留。图中仅呈现本次新增内容，既有 AscendC、950 与智能体仍保留在交互地图中。</footer>
<script src="../assets/js/knowledge-curriculum.js?v=2"></script><script>
const data=window.AscendKnowledgeCurriculum,map=document.querySelector('#map'),svg=map.querySelector('svg'),nodes={};
function box(id,title,x,y,w,h,kind){const el=document.createElement('div');el.className='box '+kind;Object.assign(el.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});el.textContent=title;map.append(el);nodes[id]={x,y,w,h};return el;}
function line(a,b,order=false){const p=nodes[a],q=nodes[b],x=p.x+p.w,y=p.y+p.h/2,xx=q.x,yy=q.y+q.h/2,m=(x+xx)/2;const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M${x},${y}C${m},${y} ${m},${yy} ${xx},${yy}`);if(order)path.classList.add('order');svg.append(path);}
box('root','昇腾学习\n知识地图',0,660,200,150,'root');box('cann','CANN',250,200,210,120,'scene');box('gen','生成式 AI',250,1000,210,120,'scene');box('training','训练开发',510,710,230,120,'group');box('inference','推理开发',510,1135,230,120,'group');line('root','cann');line('root','gen');line('gen','training');line('gen','inference');
data.paths.forEach((p,i)=>{const y=30+i*170;box(p.id,p.title,790,y,255,130,'path');line(p.parent||p.scene,p.id);p.courses.forEach((c,j)=>{const el=box(c.id,c.title,1090+j*390,y,350,130,'course'),meta=document.createElement('div');meta.className='meta';const badge=document.createElement('span');badge.className='level '+data.levels[c.level];badge.textContent=c.level;meta.append(badge,document.createTextNode('第 '+(j+1)+' 门'));el.prepend(meta);line(j?p.courses[j-1].id:p.id,c.id,j>0);});});
</script></body></html>
