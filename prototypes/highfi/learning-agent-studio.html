<header><div><h1>开发者学习中心 · 学习分身</h1><small>让每个学习目标，都有专属伙伴陪你完成</small></div><button onclick="reset()">重新体验</button></header><div class="layout"><nav id="nav"></nav><main><div class="flow" id="flow"></div><div id="screen"></div></main><aside><h3>本轮对话与选择</h3><div id="context" class="panel"></div><h3>对话记录</h3><div id="history" class="history" aria-live="polite"></div><p class="note">本原型用规则模拟意图推荐，任务完成由用户手动确认。提醒仅保存在当前演示中，不实际发送通知；刷新后本轮状态重置。</p></aside></div><footer>流程：用户提问 → 推荐／创建 → 逐步确认 → 预览任务 → 时间安排 → 任务工作台</footer>
<dialog id="reminder" aria-labelledby="planTitle"><h2 id="planTitle">安排你的学习节奏</h2><p class="muted">我会根据你可投入的时间拆解计划，陪你一步步完成。</p><label class="field">你计划什么时候学会／完成？<input id="targetDate" type="date"></label><label class="field">每周可以投入多长时间？<select id="weeklyHours"><option value="2">每周 2 小时</option><option value="5" selected>每周 5 小时</option><option value="10">每周 10 小时</option><option value="custom">自定义时长</option></select></label><label class="field" id="customHoursField" hidden>每周小时数<input id="customHours" type="number" min="0.5" max="168" step="0.5" placeholder="例如 3.5"></label><label class="reminder-toggle"><input id="enableReminder" type="checkbox" onchange="document.getElementById('reminderFields').hidden=!this.checked">开始学习前提醒我 <small>可选</small></label><div id="reminderFields" hidden><label class="field">首次提醒时间<input id="when" type="datetime-local"></label><label class="field">重复方式<select id="repeat"><option>仅一次</option><option>每天</option><option>每周同一天</option></select></label></div><p id="reminderError" role="alert"></p><div class="actions"><button class="primary" onclick="savePlan()">按这个节奏制定计划</button><button onclick="document.getElementById('reminder').close()">返回调整</button></div></dialog>
