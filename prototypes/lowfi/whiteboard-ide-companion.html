<header class="review"><span class="review-tag">低保真讨论稿 · 2026.09.28</span><h1>白板、IDE 与 AI 学伴</h1><p class="muted">八个关键状态。重点体验 IDE 报错后的可控修复，以及文档、板书和视频时间点之间的对应关系。</p><nav class="states" aria-label="低保真场景"></nav></header>
<main class="frame"><header class="top"><div class="left"><button id="exit" aria-label="回到首页场景">×</button><h2 id="lessonTitle">Ascend C · 数据搬运与计算</h2></div><div class="tools"><span class="optional muted">白板 / 视频</span><span class="optional">100%　 ‹ 1 / 3 ›</span><button id="ideToggle">打开 IDE</button><button id="companion" class="bubble" aria-label="展开 AI 学伴" aria-expanded="false">学伴</button></div></header><div id="content" class="content"></div><div id="toast" role="status" class="toast hidden"></div></main>

<script>
const scenes=[['listen','01 白板听讲'],['practice','02 白板＋IDE'],['assistant','03 IDE 中的学伴'],['error','04 报错与 AI 修复'],['materials','05 文档与跨媒体'],['prerequisite','06 前置学习'],['review','07 错题回顾'],['home','08 首页回访']];
const notes={listen:['入口','收起后的学伴固定在右上角。板书代码提供置入 IDE 入口。','状态保留','切换实践时保留板书页码、缩放和字幕位置。','跨媒体锚点','板书页同时标注关联文档章节和视频时间段。'],practice:['布局','左白板、右 IDE，中间分隔条可拖动或用方向键调宽。','置入策略','插入光标处或新建文件，不覆盖已编辑代码。','上下文','示例来源与课节一起带入；关闭 IDE 后保留代码。'],assistant:['学伴层级','用户触发后临时覆盖 IDE；关闭即恢复编辑。','统一内容','对话、我的笔记、学习回顾属于同一个学伴。','帮助边界','解读带上当前代码；任何代码改动由用户操作。'],error:['错误反馈','运行失败后同时展示错误码、位置、原因和可执行下一步。','查找答案','优先提供官方文档、关联板书和对应视频时间点。','安全修复','AI 只生成差异建议；用户确认后写入，且需再次运行验证。'],materials:['文档呈现','文档以同屏辅助卡呈现，并保留原章节和打开原文入口。','双向定位','板书 1 对应视频 03:20–05:45，跳转后可返回同一板书。','统一锚点','板书页、视频区间、文档章节和代码片段使用同一学习锚点。'],prerequisite:['触发','进入新课程且存在前置知识依赖。','证据','掌握记录未知时邀请自测，不直接判断用户不会。','用户选择','提供前置学习、自测和直接开始三个方向。'],review:['触发','测验已提交，按关联知识点汇总错题。','展开','结果摘要由用户点击进入学习回顾面板。','下一步','查看解析、回到原板书或重新练习。'],home:['返回触点','继续学习卡呈现未完成实验与待复习内容。','分身形态','右上气泡与学习页保持同一身份与位置。','打扰控制','不自动展开；同事件去重，冷却时长待细化。']};
let state='listen', open=false, tab='对话', code='// 来源：课节 2 · 板书第 1 页\nCopyIn();\nCompute();\nCopyOut();', width=47, fixApplied=false, mediaView='board', videoTime='04:10';
const content=document.querySelector('#content');
document.querySelector('.states').innerHTML=scenes.map(([id,t])=>`<button data-scene="${id}" aria-selected="false">${t}</button>`).join('');
function board(){return `<section class="board"><div class="media-map"><span class="muted">板书 01 / 数据流</span><button data-action="video">对应视频 03:20–05:45</button><button data-action="document">文档 §2.3</button></div><h3>把输入数据搬入，再计算，最后写回</h3><div class="diagram"><div class="node">CopyIn<br><small>输入搬运</small></div><span>→</span><div class="node">Compute<br><small>向量计算</small></div><span>→</span><div class="node">CopyOut<br><small>结果写回</small></div></div><h4>示例代码</h4><div class="code"><div class="code-head"><span>kernel.cpp · 基础结构</span><button class="black" data-action="insert">置入 IDE</button></div><pre>CopyIn();\nCompute();\nCopyOut();</pre><button data-action="note">加入我的笔记</button></div><div class="caption">讲解字幕：先确认数据在哪里，再决定计算如何执行。</div><span class="page">课节 2　 /　 当前进度已保留</span></section>`}
function ide(errorMode=false){const output=errorMode?`<div class="error-summary" role="alert" tabindex="-1"><strong>${fixApplied?'待验证：已应用 AI 建议':'运行失败 · 演示错误码 E-DEMO-102'}</strong><span>${fixApplied?'请重新运行，确认修复是否有效。':'kernel.cpp 第 8 行 · CopyOut 缺少结果长度参数'}</span><div class="actions">${fixApplied?'<button class="black" data-action="run">重新运行</button>':'<button data-action="locate">定位代码</button><button data-action="evidence">查看依据</button><button class="black" data-action="fix">AI 建议修复</button>'}</div></div>`:'终端 / 输出<br><span class="muted">点击运行可查看演示结果。</span>';return `<div class="split" role="separator" tabindex="0" aria-label="调整 IDE 宽度" aria-orientation="vertical" aria-valuemin="30" aria-valuemax="65" aria-valuenow="${width}"></div><section class="ide" style="width:${width}%"><header class="ide-head"><span>IDE · kernel.cpp</span><div><button data-action="explain">解读</button> <button class="black" data-action="run">运行</button></div></header><div style="padding:8px 16px" class="hint">来自：数据搬运与计算 · 板书 1</div><textarea class="editor" aria-label="代码编辑器"></textarea><div class="console" id="console">${output}</div></section>`}
function panel(overlay=false){let body;if(state==='error'&&tab==='对话'){body=`<div class="context">已带入：错误码 E-DEMO-102、kernel.cpp 第 8 行、板书 1</div><div class="message"><h4>建议修复：补充结果长度参数</h4><p>原因：CopyOut 需要明确写回长度；当前调用缺少该参数。</p><div class="diff"><div class="minus">− CopyOut();</div><div class="plus">+ CopyOut(output, resultLength);</div></div><h4 style="margin-top:12px">如何找到答案</h4><ol class="source-list"><li>官方编程指南 §2.3 · 数据搬运</li><li>当前课程板书 1 · 结果写回</li><li>视频 05:05 · CopyOut 参数说明</li></ol><div class="actions"><button data-action="evidence">查看依据</button><button data-action="copyfix">仅复制</button><button class="black" data-action="applyfix">确认并应用</button></div><p class="hint">应用只修改当前文件，不会自动运行；你仍需重新验证。</p></div>`}else if(tab==='我的笔记'){body='<div class="message"><h4>数据搬运的三个阶段</h4><p>CopyIn → Compute → CopyOut</p><small>课节 2 · 板书 1</small><div class="actions"><button data-action="backboard">回到板书</button></div></div>'}else if(tab==='学习回顾'){body='<div class="message"><h4>3 道错题涉及数据搬运</h4><p>题 2、4、5 均涉及输入输出位置判断，可先复习再练习。</p><small>依据：本次已提交的测验记录（演示）</small><div class="actions"><button data-action="analysis">查看解析</button><button data-action="backboard">回看板书</button></div></div>'}else{body='<div class="context">已带入：课节 2、板书第 1 页、当前代码</div><div class="message"><h4>这段代码分为三个阶段</h4><p>CopyIn 搬入输入，Compute 执行计算，CopyOut 写回结果。可以先检查每个阶段的输入输出位置。</p><button data-action="note">保存解读到笔记</button></div>'}return `<aside class="panel ${overlay?'overlay':''}" aria-label="AI 学伴面板"><div class="panel-head"><h3>AI 学伴</h3><button data-action="close" aria-label="收起 AI 学伴">×</button></div><nav class="panel-tabs">${['对话','我的笔记','学习回顾'].map(t=>`<button data-tab="${t}" aria-selected="${t===tab}">${t}</button>`).join('')}</nav><div class="panel-body">${body}</div><form class="chat-input"><input aria-label="向学伴提问" placeholder="就当前内容提问…"><button type="submit">发送</button></form></aside>`}
function materials(){return `<aside class="materials" aria-label="关联学习资料"><span class="muted">关联内容 · 学习锚点 A-01</span><h3>板书 1 的资料与视频</h3><div class="material-card"><b>文档</b><p>Ascend C 编程指南 §2.3<br><span class="muted">数据搬运：输入、计算与结果写回</span></p><button data-action="opendoc">打开原文 §2.3</button></div><div class="material-card"><b>视频时间点</b><div class="timeline"><button data-action="seek" data-time="03:20">03:20</button><span>输入搬运</span><button data-action="seek" data-time="04:10">04:10</button><span>向量计算</span><button data-action="seek" data-time="05:05">05:05</button><span>结果写回</span></div></div><div class="material-card"><b>映射范围</b><p class="muted">当前板书覆盖视频 03:20–05:45。切到视频后保留板书页码，返回时仍是板书 1。</p></div></aside>`}
function video(){return `<section class="video-stage"><div class="video-placeholder"><div><button class="play" aria-label="播放视频">▶</button><h3>数据搬运与计算</h3><p class="muted">已定位到 <b>${videoTime}</b> · 来源：板书 1</p></div></div><div class="video-controls"><b>${videoTime} / 08:40</b><div class="progress" aria-label="视频播放进度"></div><div class="actions"><button data-action="returnboard">返回板书 1</button><button data-action="document">查看对应文档 §2.3</button></div></div></section>${materials()}`}
function nudge(text,action,label){return `<aside class="nudge"><header><b>AI 学伴</b><button data-action="dismiss" aria-label="关闭建议">×</button></header><p>${text}</p><button class="black" data-action="${action}">${label}</button> <button data-action="dismiss">稍后</button></aside>`}
function render(){document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.scene===state)));document.querySelector('#companion').setAttribute('aria-expanded',String(open));document.querySelector('#lessonTitle').textContent=state==='home'?'开发者学习中心':state==='prerequisite'?'课程预览 · Ascend C 算子开发':state==='materials'&&mediaView==='video'?'视频 · 数据搬运与计算':'Ascend C · 数据搬运与计算';document.querySelector('#ideToggle').hidden=['home','prerequisite','review','materials'].includes(state);document.querySelector('#ideToggle').textContent=['practice','assistant','error'].includes(state)?'收起 IDE':'打开 IDE';
if(['listen','practice','assistant','error'].includes(state)){const hasIDE=state!=='listen';content.innerHTML=board()+(hasIDE?ide(state==='error'):'')+(open?panel(hasIDE):'');const editor=document.querySelector('.editor');if(editor){editor.value=code;editor.addEventListener('input',()=>code=editor.value)}bindSplit();}
if(state==='materials'){content.innerHTML=mediaView==='video'?video():board()+materials()+(open?panel(true):'');}
if(state==='prerequisite'){content.innerHTML=`<section class="preview"><span class="muted">开始之前</span><h2>Ascend C 算子开发</h2><p>学习自定义算子的编译、运行与结果验证。</p><div class="surface"><h3>建议先确认这两项基础</h3><p class="muted">本课程需要张量基础与 CANN 环境知识。</p><div class="prereq"><span class="stamp">1</span><div>张量形状与广播机制<p>掌握情况未知 · 尚无自测记录</p></div><button data-action="prereq">查看前置课</button></div><div class="prereq"><span class="stamp">2</span><div>CANN 环境配置<p>掌握情况未知 · 可直接开始或先自测</p></div><button data-action="selftest">快速自测</button></div></div><div class="surface"><h3>课程目录</h3><p>01 算子开发入门　　02 编程模型　　03 实践与验证</p><button class="black" data-action="direct">直接开始学习</button></div></section>${open?panel():nudge('你是否熟悉张量广播？可以用两道题确认学习起点。','selftest','快速自测')}`;}
if(state==='review'){content.innerHTML=`<section class="preview"><span class="muted">测验已提交 · 演示数据</span><h2>本次学习回顾</h2><div class="surface"><h3>已完成 5 道题，其中 2 道正确</h3><div class="summary"><p>3 道错题涉及数据搬运</p><p class="muted">可以从输入与输出位置开始复习，再回到原题验证。</p></div><button class="black" data-action="review">查看错题总结</button></div><div class="surface"><h3>建议的复习顺序</h3><p>回看板书第 1 页 → 对照示例代码 → 重新练习</p><button data-action="backboard">回看板书</button></div></section>${open?panel():''}`;}
if(state==='home'){content.innerHTML=`<section class="home"><span class="muted">我的学习</span><h2>继续上次的任务</h2><div class="surface course-placeholder"><div class="thumb">课程封面</div><div><h3>Ascend C 算子开发</h3><p>上次完成了代码编辑，实验还差结果验证。</p><button class="black" data-action="resume">继续实验</button></div></div><div class="surface"><h3>待复习 · 数据搬运</h3><p>有 3 道错题待回顾，来自上次提交的测验。</p><button data-action="review">复习错题</button></div></section>${open?panel():''}`;}
const n=notes[state];document.querySelector('#annotation').innerHTML=[0,2,4].map(i=>`<div><b>${n[i]}</b><p>${n[i+1]}</p></div>`).join('');}
function go(id){state=id;open=['assistant','error'].includes(id);tab=id==='review'?'学习回顾':'对话';if(id==='materials')mediaView='board';render()}
function toast(text){const t=document.querySelector('#toast');t.textContent=text;t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),2600)}
document.querySelector('.states').onclick=e=>{if(e.target.dataset.scene)go(e.target.dataset.scene)};
document.querySelector('#companion').onclick=()=>{open=!open;render()};document.querySelector('#exit').onclick=()=>go('home');document.querySelector('#ideToggle').onclick=()=>go(state==='listen'?'practice':'listen');
content.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}const a=b.dataset.action;
if(a==='insert'){if(state==='listen'){go('practice');toast('代码已置入新文件，板书位置已保留')}else{const box=document.createElement('div');box.className='nudge';box.innerHTML='<b>置入示例代码</b><p>选择置入方式，保留已编辑内容。</p><button data-action="atcursor">插入光标处</button> <button data-action="newfile">新建文件</button> <button data-action="dismiss">取消</button>';content.append(box)}}
if(a==='atcursor'){const ed=document.querySelector('.editor');const pos=ed.selectionStart;code=code.slice(0,pos)+'\nCopyIn();\nCompute();\nCopyOut();\n'+code.slice(pos);render();toast('已插入，原有代码保留')}
if(a==='newfile'){toast('演示：新建示例文件，原文件保留');e.target.closest('.nudge').remove()}
if(a==='explain'){open=true;tab='对话';render()}if(a==='close'){open=false;render()}
if(a==='note'){open=true;tab='我的笔记';render();toast('已保存到我的笔记')}
if(a==='dismiss')b.closest('.nudge').remove();if(a==='run'){if(fixApplied){document.querySelector('#console').innerHTML='<div role="status"><strong>运行成功</strong><br>结果已写回，错误 E-DEMO-102 已解除。</div>';toast('重新运行成功，修复结果已验证')}else{state='error';open=false;render();content.insertAdjacentHTML('beforeend',nudge('检测到 E-DEMO-102。我可以解释原因并生成修复建议，应用前由你确认。','fix','查看修复建议'));setTimeout(()=>document.querySelector('.error-summary')?.focus(),0)}}
if(a==='locate'){const ed=document.querySelector('.editor');ed.focus();const p=code.indexOf('CopyOut');ed.setSelectionRange(p,p+'CopyOut();'.length);toast('已定位到第 8 行 CopyOut 调用')}
if(a==='fix'){open=true;tab='对话';render()}
if(a==='applyfix'){code=code.replace('CopyOut();','CopyOut(output, resultLength);');fixApplied=true;open=false;render();toast('已应用建议，请重新运行验证')}
if(a==='copyfix'){navigator.clipboard?.writeText('CopyOut(output, resultLength);');toast('修复代码已复制，当前文件未修改')}
if(a==='evidence'){state='materials';mediaView='board';open=false;render();toast('已打开错误依据：文档 §2.3 与视频 05:05')}
if(a==='video'){state='materials';mediaView='video';videoTime='03:20';open=false;render()}
if(a==='document'||a==='opendoc'){state='materials';mediaView='board';open=false;render();toast('演示：文档 §2.3 已定位，板书页保持不变')}
if(a==='seek'){videoTime=b.dataset.time;mediaView='video';render();toast('视频已定位到 '+videoTime)}
if(a==='returnboard'){mediaView='board';render();toast('已返回板书 1，学习位置未丢失')}
if(a==='direct'||a==='backboard')go('listen');if(a==='resume')go('practice');if(a==='review'){state='review';open=true;tab='学习回顾';render()}
if(a==='analysis')b.closest('.message').insertAdjacentHTML('beforeend','<p>解析示例：CopyIn 负责输入搬运；CopyOut 负责结果写回。返回原题逐项核对。</p>');
if(a==='selftest'||a==='prereq'){toast(a==='selftest'?'低保真入口：进入张量基础自测，完成后更新掌握记录':'低保真入口：张量形状与广播机制课程预览')}
});
content.addEventListener('submit',e=>{e.preventDefault();const input=e.target.querySelector('input');if(input.value.trim()){const p=document.createElement('p');p.className='message';p.textContent=input.value;document.querySelector('.panel-body').append(p);input.value='';toast('演示已记录问题；尚未接入 AI 服务')}});
function bindSplit(){const split=document.querySelector('.split');if(!split)return;const change=v=>{width=Math.max(30,Math.min(65,v));document.querySelector('.ide').style.width=width+'%';split.setAttribute('aria-valuenow',Math.round(width))};split.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();change(width+(e.key==='ArrowLeft'?2:-2))}};split.onpointerdown=e=>{split.setPointerCapture(e.pointerId);split.onpointermove=ev=>{const r=content.getBoundingClientRect();change((r.right-ev.clientX)/r.width*100)};split.onpointerup=()=>split.onpointermove=null}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&open){open=false;render();document.querySelector('#companion').focus()}});render();
</script></body></html>
