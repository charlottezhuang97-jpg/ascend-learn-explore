<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>认证完成 · 获得证书</title>
  <style>
    *{box-sizing:border-box}body{margin:0;color:#202b3c;background:#f4f7fc;font:14px/1.55 Arial,"PingFang SC",sans-serif}.page{width:min(1120px,calc(100% - 32px));margin:28px auto 64px}.top{display:flex;align-items:center;gap:18px;height:54px;padding:0 18px;background:#fff;border:1px solid #dce5f2;border-radius:12px}.top b{font-size:15px}.top span:last-child{margin-left:auto;color:#73819a}.content{padding:26px 0}.eyebrow{color:#5676b8;font-size:12px}.title{text-align:center;margin:8px 0 5px;font-size:28px}.subtitle{text-align:center;margin:0 0 24px;color:#72809a}.issued{display:flex;justify-content:center;margin:0 auto 22px}.issued span{padding:7px 12px;border:1px solid #cbd8ee;border-radius:99px;background:#fff;color:#4569ae;font-size:12px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}.certificate{min-height:330px;display:grid;place-items:center;padding:24px;border:2px solid #9eb8e8;border-radius:14px;background:radial-gradient(#d9e5f8 1px,transparent 1px),#fff;background-size:18px 18px}.cert-inner{width:100%;max-width:600px;min-height:270px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;border:1px solid #b9c9e5;background:rgba(255,255,255,.94);text-align:center}.seal{width:54px;height:54px;display:grid;place-items:center;border:2px solid #7797d0;border-radius:50%;color:#5676b8;font-size:22px}.cert-inner small{margin-top:12px;color:#74829b}.cert-inner h2{margin:5px 0;font-size:23px}.cert-inner p{margin:5px;color:#66758f}.cert-inner strong{margin-top:6px;font-size:18px}.cert-meta{display:flex;gap:25px;margin-top:16px;color:#73819a;font-size:11px}.side{padding:19px;border:1px solid #dce5f2;border-radius:12px;background:#fff}.side h2{margin:0 0 6px;font-size:17px}.side p{margin:0;color:#73819a;font-size:12px}.actions{display:grid;gap:9px;margin-top:16px}.actions button{min-height:42px;border:1px solid #bdcbe1;border-radius:8px;background:#fff;color:#33445f;font:inherit}.actions .primary{border-color:#263044;background:#263044;color:white}.path{margin-top:18px;padding-top:15px;border-top:1px solid #e6ebf2}.path h3{margin:0 0 12px;font-size:13px}.nodes{display:flex;align-items:center;gap:5px;color:#8a96aa;font-size:10px}.nodes i{height:1px;flex:1;background:#c9d5e7}.node{width:66px;text-align:center}.node em{display:grid;place-items:center;width:34px;height:34px;margin:0 auto 5px;border:1px solid #c7d2e4;border-radius:50%;background:#fff;font-style:normal}.node.on{color:#4368ac;font-weight:600}.node.on em{border:2px solid #6488ce;background:#edf3ff}.note{margin:16px 0 0;color:#75829a;font-size:11px}.toast{display:none;margin-top:12px;padding:10px;border-radius:7px;background:#edf3ff;color:#385d9d;font-size:12px}.toast.show{display:block}@media(max-width:760px){.grid{grid-template-columns:1fr}.title{font-size:23px}.certificate{min-height:290px}.top span:not(:last-child){display:none}.cert-meta{gap:10px;flex-wrap:wrap}}
  </style>
</head>
<body>
  <main class="page">
    <nav class="top"><b>开发者学习中心</b><span>学习路径　认证中心</span><span>个人学习空间</span></nav>
    <section class="content">
      <div class="issued"><span>认证结果 · 证书已正式发放</span></div>
      <h1 class="title">恭喜你，获得开发者认证</h1>
      <p class="subtitle">你的认证成果已加入个人学习空间，知识地图也已同步更新。</p>
      <div class="grid">
        <article class="certificate" aria-label="已发放的认证证书预览">
          <div class="cert-inner"><div class="seal" aria-hidden="true">✦</div><small>ASCEND DEVELOPER CERTIFICATION</small><h2>开发者认证证书</h2><p>兹证明</p><strong>学习者姓名</strong><p>已通过算子开发者认证</p><div class="cert-meta"><span>证书编号：ASC-OP-2026-00128</span><span>颁发日期：2026 年 11 月 9 日</span></div></div>
        </article>
        <aside class="side"><h2>认证已完成</h2><p>证书已发放，可以查看、下载或分享。</p><div class="actions"><button class="primary" data-action="查看证书">查看证书</button><button data-action="下载证书">下载证书</button><button data-action="分享证书">分享证书</button></div><div class="toast" id="toast" role="status"></div><section class="path"><h3>知识地图 · 算子开发路径</h3><div class="nodes"><div class="node"><em>✓</em>基础课程</div><i></i><div class="node"><em>✓</em>实践验证</div><i></i><div class="node on"><em>✦</em>认证达成</div></div></section></aside>
      </div>
      <p class="note">此页面仅在认证系统确认通过且证书实际发放后出现；课程完成或提交考试本身不会点亮“认证达成”。</p>
    </section>
  </main>
  <script>document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{const toast=document.getElementById('toast');const action=button.dataset.action;if(action==='查看证书')document.querySelector('.certificate').scrollIntoView({behavior:'smooth',block:'center'});toast.textContent=action==='分享证书'?'低保真演示：正式版将提供可验证的分享链接。':action==='下载证书'?'低保真演示：正式版将从认证系统下载证书文件。':'当前为证书展示样式预览。';toast.classList.add('show')}));</script>
</body>
</html>
